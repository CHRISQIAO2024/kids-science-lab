<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>少儿科学互动实验室 | Kids Science Lab</title>
  <meta name="description" content="面向中小学生的 46 个趣味物理、数学曲线、三角函数、太空 3D 与前沿粒子动态科普交互实验，免安装即开即玩。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --bg-card: rgba(18, 25, 43, 0.72);
      --bg-card-hover: rgba(26, 36, 61, 0.88);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.45);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #06b6d4;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --indigo: #6366f1;
      --violet: #8b5cf6;
      --glow-blue: rgba(56, 189, 248, 0.15);
      --glow-purple: rgba(168, 85, 247, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(6, 182, 212, 0.10) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(244, 63, 94, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
    }

    /* 顶部装饰条 */
    .top-glow-line {
      height: 3px;
      background: linear-gradient(90deg, #06b6d4, #6366f1, #a855f7, #f43f5e);
      width: 100%;
    }

    header {
      padding: 40px 24px 24px;
      max-width: 1280px;
      margin: 0 auto;
      text-align: center;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.28);
      color: #a5b4fc;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .badge-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    h1 {
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .lead {
      color: var(--text-muted);
      font-size: clamp(15px, 2vw, 18px);
      max-width: 680px;
      margin: 0 auto 28px;
    }

    /* 统计指示牌 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-item strong {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    /* 搜索与随机按钮区 */
    .action-panel {
      max-width: 900px;
      margin: 0 auto 24px;
      display: flex;
      gap: 12px;
      padding: 0 12px;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 20px 0 46px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
      font-size: 16px;
    }

    .btn-surprise {
      height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-surprise:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    /* 标签导航栏 */
    .filter-wrapper {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 15, 25, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      margin-bottom: 32px;
    }

    .filter-pills {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-pills::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .filter-btn .count {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
    }

    .filter-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.07);
    }

    .filter-btn.active {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .filter-btn.active .count {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    /* 主网格 */
    main {
      max-width: 1280px;
      margin: 0 auto 60px;
      padding: 0 20px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }

    .demo-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .demo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      transition: background 0.2s;
    }

    .demo-card:hover {
      transform: translateY(-4px);
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    .demo-card:hover::before {
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
    }

    .card-top {
      margin-bottom: 16px;
    }

    .card-header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 28px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .cat-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 10px;
      border-radius: 6px;
    }

    .cat-physics { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .cat-math { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .cat-trig { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
    .cat-nature { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .cat-space { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
    .cat-quantum { background: rgba(168, 85, 247, 0.15); color: #c084fc; }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.35;
    }

    .card-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag-item {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .card-action {
      margin-top: auto;
    }

    .btn-launch {
      width: 100%;
      height: 40px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .demo-card:hover .btn-launch {
      background: #6366f1;
      border-color: #6366f1;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state h3 {
      color: #fff;
      font-size: 20px;
      margin-bottom: 8px;
    }

    /* 页脚 */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    footer a {
      color: #818cf8;
      text-decoration: none;
    }

    /* 移动端微调 */
    @media (max-width: 640px) {
      header {
        padding: 28px 16px 16px;
      }
      .card-grid {
        grid-template-columns: 1fr;
      }
      .action-panel {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="top-glow-line"></div>

  <header>
    <div class="badge-pill">
      <span class="dot"></span> 46 个互动科学实验 · 零门槛免安装
    </div>
    <h1>少儿科学互动实验室</h1>
    <p class="lead">专为中小学生设计的趣味科学动画。点击任意卡片，动手调节速度、旋转三维视角、改变重力与光线，探索真实的科学规律！</p>
    
    <div class="stats-bar">
      <div class="stat-item">🎯 物理实验 <strong>8</strong></div>
      <div class="stat-item">🚲 数学轨迹 <strong>6</strong></div>
      <div class="stat-item">🎡 三角函数 <strong>6</strong></div>
      <div class="stat-item">🌍 自然工程 <strong>7</strong></div>
      <div class="stat-item">🚀 3D 宇宙 <strong>10</strong></div>
      <div class="stat-item">🌌 量子智能 <strong>9</strong></div>
    </div>

    <div class="action-panel">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索实验（例如：重力、无人机、齿轮、黑洞、水波...）" oninput="handleSearch()">
      </div>
      <button class="btn-surprise" onclick="openRandomDemo()">
        <span>🎲</span> 随机探索一个
      </button>
    </div>
  </header>

  <nav class="filter-wrapper">
    <div class="filter-pills" id="filterPills">
      <button class="filter-btn active" data-category="all" onclick="filterCategory('all', this)">
        🌟 全部实验 <span class="count" id="countAll">46</span>
      </button>
      <button class="filter-btn" data-category="physics" onclick="filterCategory('physics', this)">
        🎯 物理实验 <span class="count">8</span>
      </button>
      <button class="filter-btn" data-category="math" onclick="filterCategory('math', this)">
        🚲 数学轨迹 <span class="count">6</span>
      </button>
      <button class="filter-btn" data-category="trig" onclick="filterCategory('trig', this)">
        🎡 三角函数 <span class="count">6</span>
      </button>
      <button class="filter-btn" data-category="nature" onclick="filterCategory('nature', this)">
        🌍 自然与工程 <span class="count">7</span>
      </button>
      <button class="filter-btn" data-category="space" onclick="filterCategory('space', this)">
        🚀 3D宇宙探索 <span class="count">10</span>
      </button>
      <button class="filter-btn" data-category="quantum" onclick="filterCategory('quantum', this)">
        🌌 量子与智能 <span class="count">9</span>
      </button>
    </div>
  </nav>

  <main>
    <div class="card-grid" id="cardGrid"></div>
  </main>

  <footer>
    <p>少儿科学互动实验室 · Kids Science Lab · 乔瑞 AI Coding 启发系列</p>
    <p style="margin-top:6px; font-size:12px; color:#64748b;">所有实验均采用 HTML5 / SVG / Canvas / Three.js 实时渲染 · 适配手机、平板与电脑</p>
  </footer>

  <script>

        desc: "当鸣笛救护车向你飞驰而来时，波纹为何被压缩得更密集？声音为何由高尖变低沉？",

      {

    let currentCategory = "all";
    let searchQuery = "";

    function renderCards() {
      const grid = document.getElementById("cardGrid");
      const filtered = DEMOS.filter(item => {
        const matchCat = (currentCategory === "all") || (item.category === currentCategory);
        if (!matchCat) return false;
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return item.title.toLowerCase().includes(q) ||
               item.subtitle.toLowerCase().includes(q) ||
               item.desc.toLowerCase().includes(q) ||
               item.tags.some(t => t.toLowerCase().includes(q));
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <h3>没有找到符合条件的实验 🔍</h3>
            <p>试着换个词搜搜看，例如“重力”、“粒子”、“齿轮”、“宇宙”</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        return `
          <article class="demo-card" data-cat="${item.category}">
            <div class="card-top">
              <div class="card-header-line">
                <div class="card-icon">${item.icon}</div>
                <span class="cat-tag cat-${item.category}">${item.categoryLabel}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
              <div class="card-sub">${item.subtitle}</div>
              <p class="card-desc">${item.desc}</p>
              <div class="card-tags">
                ${item.tags.map(t => `<span class="tag-item">#${t}</span>`).join('')}
              </div>
            </div>
            <div class="card-action">
              <a href="${item.url}" class="btn-launch" target="_blank" rel="noopener">
                立即探索 <span>➔</span>
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
      renderCards();
    }

    function handleSearch() {
      searchQuery = document.getElementById("searchInput").value.trim();
      renderCards();
    }

    function openRandomDemo() {
      const idx = Math.floor(Math.random() * DEMOS.length);
      const chosen = DEMOS[idx];
      window.open(chosen.url, '_blank');
    }

    // 初始化渲染
    renderCards();
  </script>
