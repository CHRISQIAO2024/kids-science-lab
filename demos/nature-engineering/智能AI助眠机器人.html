<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>梦梦屋｜智能 AI 助眠机器人</title>
  <style>
    :root {
      --ink: #263552;
      --muted: #71809e;
      --cream: #fffaf0;
      --panel: rgba(255, 255, 255, 0.82);
      --blue: #5578e8;
      --purple: #8c6ce9;
      --mint: #52c9b1;
      --peach: #ff9b7b;
      --yellow: #ffd66b;
      --shadow: 0 22px 60px rgba(60, 72, 123, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(255, 214, 107, .30), transparent 24%),
        radial-gradient(circle at 90% 4%, rgba(140, 108, 233, .22), transparent 28%),
        linear-gradient(150deg, #fffaf0 0%, #edf4ff 52%, #eeeaff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .34;
      background-image: radial-gradient(#71809e 0.65px, transparent 0.65px);
      background-size: 20px 20px;
    }

    button { font: inherit; }

    .app {
      position: relative;
      z-index: 1;
      width: min(1440px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 28px 28px;
      display: grid;
      grid-template-rows: auto minmax(620px, 1fr);
      gap: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand { display: flex; align-items: center; gap: 13px; }

    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: white;
      font-size: 27px;
      box-shadow: 0 10px 24px rgba(85, 120, 232, .25);
      background: linear-gradient(145deg, var(--blue), var(--purple));
    }

    h1 { margin: 0; font-size: clamp(20px, 2vw, 29px); letter-spacing: .02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

    .demo-button {
      border: 0;
      padding: 12px 18px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(85, 120, 232, .24);
      background: linear-gradient(135deg, var(--blue), var(--purple));
      transition: transform .2s, box-shadow .2s;
    }

    .demo-button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(85,120,232,.30); }
    .demo-button:focus-visible, .control-card:focus-visible, .song:focus-visible {
      outline: 3px solid rgba(85,120,232,.38);
      outline-offset: 3px;
    }

    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(340px, .7fr);
      gap: 18px;
    }

    .stage {
      position: relative;
      min-height: 620px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 34px;
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.92), rgba(243,246,255,.62) 45%, rgba(224,229,250,.75) 100%);
    }

    #scene { position: absolute; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    #scene canvas:active { cursor: grabbing; }

    .stage-title {
      position: absolute;
      left: 26px;
      top: 22px;
      z-index: 3;
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border-radius: 999px;
      color: #53617c;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(8px);
    }

    .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 5px rgba(82,201,177,.14); }
    .stage-title h2 { margin: 12px 0 3px; font-size: clamp(24px, 3.5vw, 46px); line-height: 1; }
    .stage-title p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 5;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 30px);
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.76);
      border-radius: 999px;
      color: #64718c;
      font-size: 12px;
      text-align: center;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
    }

    .feature-label {
      position: absolute;
      z-index: 7;
      opacity: 0;
      transform: translate(-50%, 8px);
      padding: 8px 12px;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      pointer-events: none;
      background: rgba(38,53,82,.90);
      box-shadow: 0 8px 24px rgba(38,53,82,.23);
      transition: opacity .25s, transform .25s;
    }

    .feature-label.show { opacity: 1; transform: translate(-50%, 0); }

    .dialogue {
      position: absolute;
      z-index: 8;
      right: 28px;
      top: 110px;
      width: min(290px, calc(100% - 56px));
      padding: 16px 18px;
      border-radius: 21px 21px 6px 21px;
      opacity: 0;
      transform: translateY(10px) scale(.96);
      pointer-events: none;
      background: rgba(255,255,255,.94);
      box-shadow: 0 14px 40px rgba(74,68,130,.18);
      transition: opacity .3s, transform .3s;
    }

    .dialogue.show { opacity: 1; transform: translateY(0) scale(1); }
    .dialogue .speaker { color: var(--purple); font-size: 12px; font-weight: 800; }
    .dialogue p { margin: 7px 0 0; font-size: 14px; line-height: 1.6; }

    .side-panel {
      min-height: 0;
      padding: 23px;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 34px;
      box-shadow: var(--shadow);
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .panel-kicker { color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
    .side-panel h2 { margin: 7px 0 5px; font-size: 23px; }
    .panel-desc { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .controls { display: grid; gap: 10px; }

    .control-card {
      position: relative;
      width: 100%;
      min-height: 76px;
      padding: 12px 44px 12px 13px;
      display: grid;
      grid-template-columns: 48px 1fr;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(112,126,166,.13);
      border-radius: 20px;
      color: inherit;
      text-align: left;
      cursor: pointer;
      background: rgba(255,255,255,.74);
      transition: transform .22s, border-color .22s, background .22s;
    }

    .control-card:hover { transform: translateX(3px); border-color: rgba(85,120,232,.28); background: white; }
    .control-card.active { border-color: rgba(85,120,232,.40); background: #fff; box-shadow: 0 9px 24px rgba(85,120,232,.10); }

    .icon-box {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      font-size: 24px;
    }

    .aroma .icon-box { background: #e4f8f1; }
    .playlist .icon-box { background: #fff1dc; }
    .music .icon-box { background: #e7edff; }
    .ai .icon-box { background: #f0e9ff; }
    .card-copy strong { display: block; font-size: 14px; }
    .card-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .arrow { position: absolute; right: 16px; color: #9aa5ba; font-size: 20px; }

    .playlist-box {
      margin-top: 14px;
      padding: 15px;
      border-radius: 21px;
      background: linear-gradient(145deg, rgba(248,247,255,.9), rgba(239,244,255,.9));
    }

    .playlist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
    .playlist-head strong { font-size: 13px; }
    .now-playing { color: var(--blue); font-size: 11px; font-weight: 700; }

    .song {
      width: 100%;
      padding: 8px 9px;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 9px;
      align-items: center;
      border: 0;
      border-radius: 12px;
      color: inherit;
      text-align: left;
      cursor: pointer;
      background: transparent;
    }

    .song:hover, .song.active { background: rgba(255,255,255,.88); }
    .song-no { color: #9aa5ba; font-size: 11px; }
    .song-name { font-size: 12px; font-weight: 700; }
    .song-time { color: #9aa5ba; font-size: 10px; }

    .progress { height: 4px; margin-top: 10px; overflow: hidden; border-radius: 4px; background: rgba(113,128,158,.15); }
    .progress span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--purple)); }
    .progress.playing span { animation: progress 12s linear infinite; }
    @keyframes progress { from { width: 0; } to { width: 100%; } }

    .lesson {
      margin-top: auto;
      padding-top: 16px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .step-badge {
      position: absolute;
      left: 25px;
      bottom: 55px;
      z-index: 7;
      max-width: min(370px, calc(100% - 50px));
      padding: 15px 17px;
      opacity: 0;
      transform: translateY(12px);
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, rgba(65,82,139,.94), rgba(112,83,172,.94));
      box-shadow: 0 14px 35px rgba(61,66,120,.24);
      transition: opacity .3s, transform .3s;
    }

    .step-badge.show { opacity: 1; transform: translateY(0); }
    .step-badge b { display: block; font-size: 12px; color: #ddd7ff; }
    .step-badge span { display: block; margin-top: 5px; font-size: 14px; line-height: 1.55; }

    @media (max-width: 900px) {
      .app { padding: 14px; grid-template-rows: auto auto; }
      main { grid-template-columns: 1fr; }
      .stage { min-height: 590px; }
      .side-panel { padding: 20px; }
      .lesson { margin-top: 16px; }
    }

    @media (max-width: 540px) {
      header { align-items: flex-start; }
      .subtitle { display: none; }
      .logo { width: 42px; height: 42px; border-radius: 14px; }
      .demo-button { padding: 10px 13px; font-size: 12px; }
      .stage { min-height: 540px; border-radius: 26px; }
      .stage-title { left: 18px; top: 18px; }
      .stage-title h2 { font-size: 27px; }
      .dialogue { right: 18px; top: 106px; }
      .step-badge { left: 18px; bottom: 52px; max-width: calc(100% - 36px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
  <!-- SpaceX 风格字体统一注入：思源宋体 (Noto Serif SC) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style id="spacex-font-override">
    body, h1, h2, h3, h4, h5, .title {
      font-family: 'Noto Serif SC', "Source Han Serif SC", "Songti SC", serif !important;
    }
    svg text {
      font-family: 'Noto Serif SC', "Source Han Serif SC", "Songti SC", serif !important;
    }
    button, input, select, .btn, .badge, .tag, .meta, .param, code, pre, .stat, footer, .kids-lab-back-float {
      font-family: 'JetBrains Mono', 'Inter', monospace, sans-serif !important;
    }
    .kids-lab-back-float {
      position: fixed !important;
      bottom: 24px !important;
      left: 24px !important;
      z-index: 999999 !important;
      background: rgba(5, 7, 13, 0.92) !important;
      backdrop-filter: blur(14px) !important;
      color: #38bdf8 !important;
      padding: 10px 18px !important;
      border-radius: 4px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      text-decoration: none !important;
      border: 1px solid rgba(56, 189, 248, 0.4) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(56, 189, 248, 0.2) !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      transition: all 0.2s !important;
    }
    .kids-lab-back-float:hover {
      background: #38bdf8 !important;
      color: #000 !important;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.6) !important;
      transform: translateY(-2px) !important;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">☾</div>
        <div>
          <h1>梦梦屋 · 智能 AI 助眠机器人</h1>
          <p class="subtitle">一间会闻香、会唱歌、还会聊天的小房子</p>
        </div>
      </div>
      <button class="demo-button" id="demoBtn" type="button">▶ 自动演示</button>
    </header>

    <main>
      <section class="stage" aria-label="智能助眠机器人三维展示区">
        <div id="scene"></div>
        <div class="stage-title">
          <span class="eyebrow"><i></i> 3D 功能探索</span>
          <h2>你好，我是梦梦屋</h2>
          <p>点击右侧功能，看看我怎样陪你安心入睡。</p>
        </div>
        <div class="dialogue" id="dialogue" role="status" aria-live="polite">
          <span class="speaker">AI 小梦正在回答</span>
          <p id="dialogueText">晚安！我们先做三次慢慢的深呼吸吧。</p>
        </div>
        <div class="feature-label" id="featureLabel">功能名称</div>
        <div class="step-badge" id="stepBadge"><b>自动演示 · 第 1 站</b><span>说明内容</span></div>
        <div class="hint">🖱️ 拖动旋转 · 滚轮缩放 · 点击右侧卡片体验</div>
      </section>

      <aside class="side-panel">
        <span class="panel-kicker">HOW IT WORKS</span>
        <h2>它是怎样助眠的？</h2>
        <p class="panel-desc">每个部位都有不同本领。点击卡片，3D 模型会用动画告诉你答案。</p>

        <div class="controls">
          <button class="control-card aroma" data-action="aroma" type="button">
            <span class="icon-box">🌿</span>
            <span class="card-copy"><strong>烟囱 · 香薰机</strong><span>柔和香气变成彩色小云朵</span></span>
            <span class="arrow">›</span>
          </button>
          <button class="control-card playlist" data-action="playlist" type="button">
            <span class="icon-box">🎵</span>
            <span class="card-copy"><strong>大窗户 · 音乐歌单</strong><span>在窗户里挑选喜欢的助眠曲</span></span>
            <span class="arrow">›</span>
          </button>
          <button class="control-card music" data-action="music" type="button">
            <span class="icon-box">🔊</span>
            <span class="card-copy"><strong>左音响 · 播放音乐</strong><span>声波一圈圈扩散，音量更直观</span></span>
            <span class="arrow">›</span>
          </button>
          <button class="control-card ai" data-action="ai" type="button">
            <span class="icon-box">✨</span>
            <span class="card-copy"><strong>右音响 · 对话 AI</strong><span>说出心情，AI 给出睡前小建议</span></span>
            <span class="arrow">›</span>
          </button>
        </div>

        <div class="playlist-box">
          <div class="playlist-head"><strong>今晚的助眠歌单</strong><span class="now-playing" id="nowPlaying">等待播放</span></div>
          <button class="song" data-song="星空摇篮曲" type="button"><span class="song-no">01</span><span class="song-name">星空摇篮曲</span><span class="song-time">03:20</span></button>
          <button class="song" data-song="森林的晚风" type="button"><span class="song-no">02</span><span class="song-name">森林的晚风</span><span class="song-time">04:05</span></button>
          <button class="song" data-song="月亮小夜曲" type="button"><span class="song-no">03</span><span class="song-name">月亮小夜曲</span><span class="song-time">02:48</span></button>
          <div class="progress" id="progress"><span></span></div>
        </div>

        <div class="lesson">💡 科普小提示：机器人把传感器、音响和 AI 程序组合在一起，才能“感知、思考、行动”。</div>
      </aside>
    </main>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const mount = document.getElementById('scene');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
    camera.position.set(8.7, 5.9, 10.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 1.6, 0);
    controls.minDistance = 8;
    controls.maxDistance = 18;
    controls.minPolarAngle = Math.PI * 0.22;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.enablePan = false;

    scene.add(new THREE.HemisphereLight(0xf7f4ff, 0x7b86a6, 2.4));
    const keyLight = new THREE.DirectionalLight(0xfff0d2, 3.2);
    keyLight.position.set(6, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);
    const fillLight = new THREE.PointLight(0x8e7dff, 18, 22);
    fillLight.position.set(-5, 4, 5);
    scene.add(fillLight);

    const mat = (color, options = {}) => new THREE.MeshStandardMaterial({ color, roughness: .55, metalness: .05, ...options });
    const roundedBox = (w, h, d, r, material) => {
      const shape = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: r * .34, bevelThickness: r * .34 });
      geo.center();
      return new THREE.Mesh(geo, material);
    };

    const robot = new THREE.Group();
    robot.rotation.y = -0.08;
    scene.add(robot);

    // Ground and floating platform.
    const ground = new THREE.Mesh(new THREE.CircleGeometry(5.8, 80), new THREE.MeshStandardMaterial({ color: 0xe8eaf7, transparent: true, opacity: .58, roughness: 1 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.25;
    ground.receiveShadow = true;
    scene.add(ground);

    const platform = new THREE.Mesh(new THREE.CylinderGeometry(3.75, 3.95, .38, 64), mat(0xd8ddf2));
    platform.position.y = -1.02;
    platform.receiveShadow = true;
    platform.castShadow = true;
    robot.add(platform);
    const platformRing = new THREE.Mesh(new THREE.TorusGeometry(3.28, .055, 10, 80), new THREE.MeshBasicMaterial({ color: 0x8b83ee, transparent: true, opacity: .45 }));
    platformRing.rotation.x = Math.PI / 2;
    platformRing.position.y = -.79;
    robot.add(platformRing);

    // Main house body.
    const body = roundedBox(5.4, 4.45, 2.95, .42, mat(0xf2eadc));
    body.position.y = 1.25;
    body.castShadow = true;
    robot.add(body);

    // Roof.
    const roofGeo = new THREE.ConeGeometry(4.34, 2.25, 4);
    const roof = new THREE.Mesh(roofGeo, mat(0x7465c9));
    roof.rotation.y = Math.PI / 4;
    roof.scale.z = .72;
    roof.position.y = 4.18;
    roof.castShadow = true;
    robot.add(roof);
    const roofTrim = new THREE.Mesh(new THREE.BoxGeometry(5.92, .16, 3.42), mat(0x5c52ac));
    roofTrim.position.set(0, 3.18, 0);
    robot.add(roofTrim);

    // Chimney and aroma cap.
    const chimney = new THREE.Group();
    chimney.position.set(1.55, 4.72, -.2);
    const chimneyBody = roundedBox(.72, 1.5, .72, .14, mat(0xf09c7e));
    chimneyBody.castShadow = true;
    chimney.add(chimneyBody);
    const chimneyCap = new THREE.Mesh(new THREE.CylinderGeometry(.5, .42, .16, 24), mat(0xffc17d));
    chimneyCap.position.y = .78;
    chimney.add(chimneyCap);
    robot.add(chimney);

    // Window / playlist screen.
    const windowGroup = new THREE.Group();
    windowGroup.position.set(0, 2.13, 1.55);
    const windowFrame = roundedBox(3.46, 1.78, .18, .25, mat(0x4f5ca9));
    windowGroup.add(windowFrame);
    const screenMat = new THREE.MeshStandardMaterial({ color: 0xaee7ec, emissive: 0x285077, emissiveIntensity: .45, roughness: .28 });
    const screen = roundedBox(3.05, 1.39, .10, .18, screenMat);
    screen.position.z = .13;
    windowGroup.add(screen);
    const screenLines = [];
    [0.37, 0, -0.37].forEach((y, i) => {
      const lineGroup = new THREE.Group();
      const dot = new THREE.Mesh(new THREE.CircleGeometry(.085, 18), new THREE.MeshBasicMaterial({ color: [0xffd86d, 0xff9e83, 0x8a7ce9][i] }));
      dot.position.set(-1.08, y, .205);
      lineGroup.add(dot);
      const line = new THREE.Mesh(new THREE.PlaneGeometry(1.38 - i * .12, .075), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .76 }));
      line.position.set(-.12, y, .205);
      lineGroup.add(line);
      const play = new THREE.Mesh(new THREE.CircleGeometry(.1, 18), new THREE.MeshBasicMaterial({ color: 0x5d70bb }));
      play.position.set(1.12, y, .206);
      lineGroup.add(play);
      windowGroup.add(lineGroup);
      screenLines.push(lineGroup);
    });
    robot.add(windowGroup);

    // Door.
    const doorGroup = new THREE.Group();
    doorGroup.position.set(0, -.02, 1.58);
    const door = roundedBox(3.16, 2.23, .20, .28, mat(0xe5c8a4));
    doorGroup.add(door);
    const doorTop = new THREE.Mesh(new THREE.PlaneGeometry(2.55, .07), new THREE.MeshBasicMaterial({ color: 0xc09c75 }));
    doorTop.position.set(0, .62, .116);
    doorGroup.add(doorTop);
    robot.add(doorGroup);

    // Speakers.
    const speakerGroups = [];
    const speakerCenters = [];
    function makeSpeaker(x, color, ai = false) {
      const group = new THREE.Group();
      group.position.set(x, -.28, 1.77);
      const shell = new THREE.Mesh(new THREE.CylinderGeometry(.57, .57, .20, 40), mat(0x424c72));
      shell.rotation.x = Math.PI / 2;
      group.add(shell);
      const cone = new THREE.Mesh(new THREE.CylinderGeometry(.17, .42, .13, 32), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .15, roughness: .4 }));
      cone.rotation.x = Math.PI / 2;
      cone.position.z = .14;
      group.add(cone);
      const center = new THREE.Mesh(new THREE.SphereGeometry(.105, 24, 16), new THREE.MeshStandardMaterial({ color: ai ? 0xf6f1ff : 0xffe2a6, emissive: color, emissiveIntensity: .7 }));
      center.position.z = .27;
      group.add(center);
      const tag = roundedBox(.93, .28, .06, .08, mat(ai ? 0x8f73df : 0x5c7bdd, { emissive: ai ? 0x3d276e : 0x263f86, emissiveIntensity: .3 }));
      tag.position.set(0, -.73, .12);
      group.add(tag);
      const rings = [];
      for (let i = 0; i < 3; i++) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(.52, .026, 10, 40), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0 }));
        ring.position.z = .3;
        group.add(ring);
        rings.push(ring);
      }
      robot.add(group);
      speakerGroups.push({ group, cone, center, rings, ai });
      speakerCenters.push(group.position.clone());
    }
    makeSpeaker(-.88, 0x6da0ff, false);
    makeSpeaker(.88, 0xa98cff, true);

    // Feet and sleepy face details.
    [-1.65, 1.65].forEach(x => {
      const foot = roundedBox(1.15, .55, 2.1, .22, mat(0xd9d4c7));
      foot.position.set(x, -1.0, .15);
      foot.castShadow = true;
      robot.add(foot);
    });

    const starGeo = new THREE.OctahedronGeometry(.11, 0);
    const decorativeStars = [];
    for (let i = 0; i < 14; i++) {
      const star = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffd86d : 0xa99af0, transparent: true, opacity: .45 }));
      const a = i / 14 * Math.PI * 2;
      star.position.set(Math.cos(a) * (4.2 + (i % 3) * .17), .25 + (i % 4) * .68, Math.sin(a) * 2.1 - .3);
      scene.add(star);
      decorativeStars.push(star);
    }

    // Aroma particles.
    const aromaGroup = new THREE.Group();
    robot.add(aromaGroup);
    const aromaParticles = [];
    const aromaColors = [0x88dec0, 0xc59af3, 0xffc889, 0x8bc9ee];
    for (let i = 0; i < 30; i++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(.10 + (i % 4) * .025, 14, 10),
        new THREE.MeshBasicMaterial({ color: aromaColors[i % aromaColors.length], transparent: true, opacity: 0 })
      );
      puff.userData.offset = Math.random() * 4.7;
      puff.userData.angle = Math.random() * Math.PI * 2;
      aromaGroup.add(puff);
      aromaParticles.push(puff);
    }

    // Music notes created with simple 3D shapes.
    const notes = [];
    for (let i = 0; i < 9; i++) {
      const note = new THREE.Group();
      const head = new THREE.Mesh(new THREE.SphereGeometry(.11, 16, 12), new THREE.MeshBasicMaterial({ color: i % 2 ? 0xffd16e : 0x8c7aed, transparent: true, opacity: 0 }));
      head.scale.set(1.25, .8, .7);
      const stem = new THREE.Mesh(new THREE.BoxGeometry(.035, .48, .035), head.material);
      stem.position.set(.12, .21, 0);
      note.add(head, stem);
      note.userData.offset = i * .48;
      robot.add(note);
      notes.push(note);
    }

    const state = { aroma: false, playlist: false, music: false, ai: false, demo: false };
    let activeAction = '';
    let audioContext = null;
    let chimeTimer = null;
    let demoTimers = [];

    const featureLabel = document.getElementById('featureLabel');
    const dialogue = document.getElementById('dialogue');
    const dialogueText = document.getElementById('dialogueText');
    const progress = document.getElementById('progress');
    const nowPlaying = document.getElementById('nowPlaying');
    const stepBadge = document.getElementById('stepBadge');
    const demoBtn = document.getElementById('demoBtn');

    function stopDemo() {
      demoTimers.forEach(clearTimeout);
      demoTimers = [];
      state.demo = false;
      demoBtn.textContent = '▶ 自动演示';
      stepBadge.classList.remove('show');
    }

    function resetState(keepAudio = false) {
      state.aroma = state.playlist = state.music = state.ai = false;
      activeAction = '';
      document.querySelectorAll('.control-card').forEach(el => el.classList.remove('active'));
      dialogue.classList.remove('show');
      featureLabel.classList.remove('show');
      progress.classList.remove('playing');
      screenMat.emissiveIntensity = .45;
      if (!keepAudio) stopChime();
    }

    function showLabel(text, object3D, yOffset = -38) {
      const p = object3D.getWorldPosition(new THREE.Vector3()).project(camera);
      const rect = mount.getBoundingClientRect();
      featureLabel.textContent = text;
      featureLabel.style.left = `${(p.x * .5 + .5) * rect.width}px`;
      featureLabel.style.top = `${(-p.y * .5 + .5) * rect.height + yOffset}px`;
      featureLabel.classList.add('show');
    }

    function activate(action, options = {}) {
      if (!options.fromDemo) stopDemo();
      resetState(action === 'music');
      activeAction = action;
      state[action] = true;
      document.querySelector(`[data-action="${action}"]`)?.classList.add('active');

      if (action === 'aroma') showLabel('🌿 香薰小云朵', chimney, -56);
      if (action === 'playlist') {
        showLabel('🎵 窗户歌单', windowGroup, -72);
        screenMat.emissiveIntensity = 1.45;
        progress.classList.add('playing');
        nowPlaying.textContent = '歌单已打开';
      }
      if (action === 'music') {
        showLabel('🔊 音乐音响', speakerGroups[0].group, -66);
        progress.classList.add('playing');
        nowPlaying.textContent = '正在播放 · 星空摇篮曲';
        startChime();
      }
      if (action === 'ai') {
        showLabel('✨ 可对话 AI', speakerGroups[1].group, -66);
        dialogueText.textContent = '如果今天有点紧张，可以告诉我。我们一起吸气 4 秒、停 2 秒，再慢慢呼气 6 秒。';
        dialogue.classList.add('show');
      }
    }

    document.querySelectorAll('.control-card').forEach(btn => {
      btn.addEventListener('click', () => activate(btn.dataset.action));
    });

    document.querySelectorAll('.song').forEach((song, index) => {
      song.addEventListener('click', () => {
        stopDemo();
        document.querySelectorAll('.song').forEach(s => s.classList.remove('active'));
        song.classList.add('active');
        nowPlaying.textContent = `正在播放 · ${song.dataset.song}`;
        progress.classList.remove('playing');
        void progress.offsetWidth;
        progress.classList.add('playing');
        activate('music');
        nowPlaying.textContent = `正在播放 · ${song.dataset.song}`;
        const pitches = [261.63, 293.66, 329.63];
        playTone(pitches[index], .5, .035);
      });
    });

    function ensureAudio() {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      return audioContext;
    }

    function playTone(frequency = 261.63, duration = .8, volume = .028) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + .08);
      gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration + .05);
    }

    function startChime() {
      stopChime();
      const melody = [261.63, 329.63, 392, 329.63, 293.66, 349.23];
      let i = 0;
      playTone(melody[i++], 1.2);
      chimeTimer = setInterval(() => playTone(melody[(i++) % melody.length], 1.2), 1350);
    }

    function stopChime() {
      if (chimeTimer) clearInterval(chimeTimer);
      chimeTimer = null;
    }

    const demoSteps = [
      { action: 'aroma', title: '第 1 站 · 烟囱香薰', copy: '彩色小云朵代表香薰分子，它们缓缓扩散，让房间有轻柔的气味。' },
      { action: 'playlist', title: '第 2 站 · 窗户歌单', copy: '大窗户也是一块屏幕，可以看见并挑选今晚想听的助眠音乐。' },
      { action: 'music', title: '第 3 站 · 音乐音响', copy: '左边音响负责播放音乐。扩散的圆圈代表声波正在向四周传播。' },
      { action: 'ai', title: '第 4 站 · 对话 AI', copy: '右边音响能听懂问题，用 AI 给出呼吸练习和睡前陪伴建议。' }
    ];

    function runDemo() {
      if (state.demo) { stopDemo(); resetState(); return; }
      stopDemo();
      state.demo = true;
      demoBtn.textContent = '■ 停止演示';
      const showStep = index => {
        const step = demoSteps[index];
        activate(step.action, { fromDemo: true });
        state.demo = true;
        stepBadge.innerHTML = `<b>自动演示 · ${step.title}</b><span>${step.copy}</span>`;
        stepBadge.classList.add('show');
        cameraTargetFor(step.action);
      };
      demoSteps.forEach((_, i) => demoTimers.push(setTimeout(() => showStep(i), i * 4300)));
      demoTimers.push(setTimeout(() => {
        stopDemo();
        stepBadge.innerHTML = '<b>演示完成</b><span>现在轮到你啦！点击右侧卡片，自由探索梦梦屋。</span>';
        stepBadge.classList.add('show');
        setTimeout(() => stepBadge.classList.remove('show'), 3600);
      }, demoSteps.length * 4300));
    }
    demoBtn.addEventListener('click', runDemo);

    let cameraTween = null;
    function cameraTargetFor(action) {
      const targets = {
        aroma: { p: [6.6, 6.9, 9.1], t: [1.1, 3.5, 0] },
        playlist: { p: [7.2, 4.4, 10.2], t: [0, 1.85, .5] },
        music: { p: [6.3, 2.7, 9.4], t: [-.55, .1, .75] },
        ai: { p: [6.3, 2.7, 9.4], t: [.55, .1, .75] }
      };
      cameraTween = { start: performance.now(), duration: 900, fromP: camera.position.clone(), fromT: controls.target.clone(), toP: new THREE.Vector3(...targets[action].p), toT: new THREE.Vector3(...targets[action].t) };
    }

    function easeInOut(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function resize() {
      const rect = mount.getBoundingClientRect();
      renderer.setSize(rect.width, rect.height, false);
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();

    const clock = new THREE.Clock();
    function animate(now) {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      robot.position.y = Math.sin(t * .75) * .035;
      platformRing.material.opacity = .33 + Math.sin(t * 1.4) * .1;
      decorativeStars.forEach((s, i) => {
        s.rotation.x += .004;
        s.rotation.y += .006;
        s.material.opacity = .28 + Math.sin(t * 1.5 + i) * .18;
      });

      aromaParticles.forEach((p, i) => {
        const life = (t * .52 + p.userData.offset) % 4.7;
        p.position.set(1.55 + Math.sin(life * 2.1 + p.userData.angle) * (.16 + life * .055), 5.53 + life * .68, -.2 + Math.cos(life * 1.7 + p.userData.angle) * .18);
        const visible = state.aroma ? Math.sin(Math.min(1, life) * Math.PI / 2) * Math.max(0, 1 - life / 4.7) : 0;
        p.material.opacity += (visible * .72 - p.material.opacity) * .08;
        p.scale.setScalar(.7 + life * .18);
      });

      screenLines.forEach((line, i) => {
        const s = state.playlist ? 1 + Math.sin(t * 4 + i * .9) * .045 : 1;
        line.scale.set(s, s, s);
      });

      speakerGroups.forEach((speaker, speakerIndex) => {
        const active = speakerIndex === 0 ? state.music : state.ai;
        speaker.cone.scale.setScalar(active ? 1 + Math.sin(t * (speaker.ai ? 4 : 7)) * .10 : 1);
        speaker.center.material.emissiveIntensity = active ? 1.5 + Math.sin(t * 5) * .7 : .7;
        speaker.rings.forEach((ring, i) => {
          const cycle = (t * (speaker.ai ? .7 : 1.15) + i * .75) % 2.25;
          ring.scale.setScalar(1 + cycle * 1.05);
          ring.material.opacity = active ? Math.max(0, .50 - cycle * .22) : 0;
        });
      });

      notes.forEach((note, i) => {
        const life = (t * .8 + note.userData.offset) % 4.3;
        note.position.set(-.9 + Math.sin(life * 1.5 + i) * .72, .5 + life * .78, 2.15 + Math.cos(life + i) * .13);
        note.rotation.z = Math.sin(t * 1.4 + i) * .2;
        note.children.forEach(child => child.material.opacity = state.music ? Math.max(0, .82 - life * .19) : 0);
      });

      if (activeAction && featureLabel.classList.contains('show')) {
        const target = activeAction === 'aroma' ? chimney : activeAction === 'playlist' ? windowGroup : activeAction === 'music' ? speakerGroups[0].group : speakerGroups[1].group;
        const offset = activeAction === 'aroma' ? -56 : activeAction === 'playlist' ? -72 : -66;
        showLabel(featureLabel.textContent, target, offset);
      }

      if (cameraTween) {
        const amount = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
        const eased = easeInOut(amount);
        camera.position.lerpVectors(cameraTween.fromP, cameraTween.toP, eased);
        controls.target.lerpVectors(cameraTween.fromT, cameraTween.toT, eased);
        if (amount >= 1) cameraTween = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Start with a short, silent visual cue so students immediately notice interactivity.
    setTimeout(() => activate('aroma'), 650);
    setTimeout(() => resetState(), 3300);
  </script>
