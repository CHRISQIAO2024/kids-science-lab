.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;section id=&quot;byd-skyrail-vis&quot; aria-label=&quot;比亚迪云巴基地环形轨道动态三维示意图&quot;&gt;
  &lt;style&gt;
    #byd-skyrail-vis {

  &lt;/style&gt;

  &lt;header class=&quot;skyrail-head&quot;&gt;
    &lt;div class=&quot;skyrail-title&quot;&gt;
      &lt;p class=&quot;skyrail-kicker&quot;&gt;SHENZHEN · SMART TRANSIT&lt;/p&gt;
      &lt;h2&gt;比亚迪云巴基地&lt;/h2&gt;
      &lt;p class=&quot;skyrail-subtitle&quot;&gt;环形轨道 · 智能调度 · 多站点协同运行&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;skyrail-badge&quot;&gt;&lt;b&gt;8&lt;/b&gt; 个站点 · &lt;b&gt;3&lt;/b&gt; 列云巴&lt;/div&gt;
  &lt;/header&gt;

  &lt;div class=&quot;skyrail-note&quot;&gt;拖动旋转 · 滚轮缩放 · 点击站点聚焦&lt;/div&gt;
  &lt;div class=&quot;skyrail-canvas&quot; role=&quot;img&quot; aria-label=&quot;三列云巴沿环形高架轨道经过基地入口站、智造中心站、研发中心站等八个站点&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;skyrail-labels&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;

  &lt;div class=&quot;skyrail-controls&quot;&gt;
    &lt;div class=&quot;control-group&quot;&gt;
      &lt;button type=&quot;button&quot; data-action=&quot;toggle&quot; aria-pressed=&quot;true&quot;&gt;暂停运行&lt;/button&gt;
      &lt;button type=&quot;button&quot; data-action=&quot;reset&quot;&gt;重置视角&lt;/button&gt;
      &lt;button type=&quot;button&quot; data-action=&quot;view&quot;&gt;切换俯视&lt;/button&gt;
    &lt;/div&gt;
    &lt;div class=&quot;status-group&quot;&gt;
      &lt;span class=&quot;status-chip&quot;&gt;&lt;i&gt;&lt;/i&gt;系统运行正常&lt;/span&gt;
      &lt;span class=&quot;status-chip&quot; data-next&gt;下一站：智造中心站&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;script type=&quot;module&quot;&gt;
    import * as THREE from &#x27;https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js&#x27;;

    const root = document.getElementById(&#x27;byd-skyrail-vis&#x27;);
    const mount = root.querySelector(&#x27;.skyrail-canvas&#x27;);
    const labelLayer = root.querySelector(&#x27;.skyrail-labels&#x27;);
    const nextLabel = root.querySelector(&#x27;[data-next]&#x27;);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07101b, 0.016);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
    const defaultCamera = new THREE.Vector3(36, 29, 38);
    camera.position.copy(defaultCamera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(mount.clientWidth, mount.clientHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    mount.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xbfefff, 0x101620, 2.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(18, 32, 20);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);
    const redLight = new THREE.PointLight(0xe31b23, 120, 55, 2);
    redLight.position.set(-19, 10, -14);
    scene.add(redLight);

    const world = new THREE.Group();
    scene.add(world);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(34, 96),
      new THREE.MeshStandardMaterial({ color: 0x0a1520, roughness: 0.92, metalness: 0.08 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    world.add(ground);

    const grid = new THREE.GridHelper(64, 32, 0x21445a, 0x142a38);
    grid.position.y = 0.025;
    grid.material.transparent = true;
    grid.material.opacity = 0.34;
    world.add(grid);

    const ringRadius = 20;
    const trackHeight = 6.1;
    const trackMaterial = new THREE.MeshStandardMaterial({ color: 0xb8c0c8, metalness: 0.72, roughness: 0.32 });
    const darkTrackMaterial = new THREE.MeshStandardMaterial({ color: 0x303b45, metalness: 0.55, roughness: 0.5 });
    [ringRadius - 0.72, ringRadius + 0.72].forEach(radius =&gt; {
      const rail = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.16, 10, 160), trackMaterial);
      rail.rotation.x = Math.PI / 2;
      rail.position.y = trackHeight;
      rail.castShadow = true;
      world.add(rail);
    });
    const beam = new THREE.Mesh(new THREE.TorusGeometry(ringRadius, 0.62, 12, 160), darkTrackMaterial);
    beam.rotation.x = Math.PI / 2;
    beam.position.y = trackHeight - 0.5;
    world.add(beam);

    for (let i = 0; i &lt; 32; i++) {
      const a = i / 32 * Math.PI * 2;
      const sleeper = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.16, 0.34), trackMaterial);
      sleeper.position.set(Math.cos(a) * ringRadius, trackHeight, Math.sin(a) * ringRadius);
      sleeper.rotation.y = -a;
      world.add(sleeper);
    }

    for (let i = 0; i &lt; 16; i++) {
      const a = i / 16 * Math.PI * 2;
      const pillar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.34, 0.5, trackHeight - 0.45, 10),
        new THREE.MeshStandardMaterial({ color: 0x66727d, metalness: 0.35, roughness: 0.65 })
      );
      pillar.position.set(Math.cos(a) * ringRadius, (trackHeight - 0.45) / 2, Math.sin(a) * ringRadius);
      pillar.castShadow = true;
      pillar.receiveShadow = true;
      world.add(pillar);
    }

    const centralBuilding = new THREE.Group();
    const podium = new THREE.Mesh(
      new THREE.CylinderGeometry(8.3, 9.2, 1.1, 8),
      new THREE.MeshStandardMaterial({ color: 0x142637, roughness: 0.72, metalness: 0.15 })
    );
    podium.position.y = 0.55;
    podium.receiveShadow = true;
    centralBuilding.add(podium);
    const tower = new THREE.Mesh(
      new THREE.CylinderGeometry(5.4, 6.5, 4.2, 8),
      new THREE.MeshStandardMaterial({ color: 0x263b4b, roughness: 0.35, metalness: 0.5 })
    );
    tower.position.y = 2.75;
    tower.castShadow = true;
    centralBuilding.add(tower);
    const crown = new THREE.Mesh(
      new THREE.TorusGeometry(5.45, 0.17, 8, 48),
      new THREE.MeshBasicMaterial({ color: 0xe31b23 })
    );
    crown.rotation.x = Math.PI / 2;
    crown.position.y = 4.88;
    centralBuilding.add(crown);
    world.add(centralBuilding);

    const stationNames = [&#x27;基地入口站&#x27;,&#x27;智造中心站&#x27;,&#x27;研发中心站&#x27;,&#x27;试验线站&#x27;,&#x27;生态公园站&#x27;,&#x27;云巴展厅站&#x27;,&#x27;能源中心站&#x27;,&#x27;综合服务站&#x27;];
    const stations = [];
    const stationGeo = new THREE.BoxGeometry(4.7, 0.46, 2.45);
    const canopyGeo = new THREE.BoxGeometry(4.9, 0.14, 2.7);
    const stationMaterial = new THREE.MeshStandardMaterial({ color: 0xd8e0e6, metalness: 0.38, roughness: 0.35 });
    const canopyMaterial = new THREE.MeshStandardMaterial({ color: 0x213b4d, metalness: 0.65, roughness: 0.25 });

    stationNames.forEach((name, index) =&gt; {
      const angle = index / stationNames.length * Math.PI * 2;
      const group = new THREE.Group();
      group.position.set(Math.cos(angle) * ringRadius, trackHeight + 0.28, Math.sin(angle) * ringRadius);
      group.rotation.y = -angle;
      const platform = new THREE.Mesh(stationGeo, stationMaterial);
      platform.castShadow = true;
      group.add(platform);
      const canopy = new THREE.Mesh(canopyGeo, canopyMaterial);
      canopy.position.y = 1.45;
      group.add(canopy);
      [-1.75, 1.75].forEach(x =&gt; {
        [-0.82, 0.82].forEach(z =&gt; {
          const post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.45, 6), trackMaterial);
          post.position.set(x, 0.72, z);
          group.add(post);
        });
      });
      const light = new THREE.PointLight(0x4de5ff, 15, 7, 2);
      light.position.y = 1.05;
      group.add(light);
      world.add(group);

      const label = document.createElement(&#x27;span&#x27;);
      label.className = &#x27;station-label&#x27;;
      label.textContent = name;
      labelLayer.appendChild(label);
      stations.push({ name, angle, group, label, worldPoint: new THREE.Vector3() });
    });

    function createTrain() {
      const train = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(4.2, 1.28, 1.78),
        new THREE.MeshStandardMaterial({ color: 0xf1f3f5, metalness: 0.32, roughness: 0.3 })
      );
      body.position.y = 0.72;
      body.castShadow = true;
      train.add(body);
      const nose = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 1.05, 1.65),
        new THREE.MeshStandardMaterial({ color: 0xe31b23, metalness: 0.25, roughness: 0.28 })
      );
      nose.position.set(2.25, 0.72, 0);
      train.add(nose);
      const windows = new THREE.Mesh(
        new THREE.BoxGeometry(2.7, 0.5, 1.84),
        new THREE.MeshStandardMaterial({ color: 0x153446, emissive: 0x0d2638, emissiveIntensity: 0.8, metalness: 0.7, roughness: 0.18 })
      );
      windows.position.set(-0.25, 0.86, 0);
      train.add(windows);
      const undercarriage = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.34, 1.2), darkTrackMaterial);
      undercarriage.position.y = -0.08;
      train.add(undercarriage);
      return train;
    }

    const trains = [0.03, 0.36, 0.69].map((progress, index) =&gt; {
      const train = createTrain();
      train.userData.progress = progress;
      train.userData.speed = 0.017 + index * 0.0015;
      world.add(train);
      return train;
    });

    let running = true;
    let topView = false;
    let yaw = 0;
    let pitch = 0.52;
    let distance = 54;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    const target = new THREE.Vector3(0, 3.6, 0);
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const clock = new THREE.Clock();

    function updateCamera() {
      if (topView) {
        camera.position.lerp(new THREE.Vector3(0.01, 62, 0.01), 0.12);
      } else {
        const cp = Math.cos(pitch);
        const desired = new THREE.Vector3(
          target.x + Math.sin(yaw) * cp * distance,
          target.y + Math.sin(pitch) * distance,
          target.z + Math.cos(yaw) * cp * distance
        );
        camera.position.lerp(desired, 0.16);
      }
      camera.lookAt(target);
    }

    function placeTrain(train) {
      const angle = train.userData.progress * Math.PI * 2;
      train.position.set(Math.cos(angle) * ringRadius, trackHeight + 0.65, Math.sin(angle) * ringRadius);
      train.rotation.y = -angle;
    }
    trains.forEach(placeTrain);

    function updateLabels() {
      const width = mount.clientWidth;
      const height = mount.clientHeight;
      stations.forEach(station =&gt; {
        station.group.getWorldPosition(station.worldPoint);
        station.worldPoint.y += 2.35;
        const projected = station.worldPoint.clone().project(camera);
        const visible = projected.z &gt; -1 &amp;&amp; projected.z &lt; 1;
        station.label.style.left = `${(projected.x * 0.5 + 0.5) * width}px`;
        station.label.style.top = `${(-projected.y * 0.5 + 0.5) * height}px`;
        station.label.style.opacity = visible ? &#x27;1&#x27; : &#x27;0&#x27;;
      });
    }

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      if (running) {
        trains.forEach(train =&gt; {
          train.userData.progress = (train.userData.progress + train.userData.speed * dt) % 1;
          placeTrain(train);
        });
      }
      const leadIndex = Math.ceil(trains[0].userData.progress * stationNames.length) % stationNames.length;
      nextLabel.textContent = `下一站：${stationNames[leadIndex]}`;
      stations.forEach((station, index) =&gt; station.label.classList.toggle(&#x27;is-active&#x27;, index === leadIndex));
      updateCamera();
      updateLabels();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function resize() {
      const width = mount.clientWidth;
      const height = mount.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height, false);
    }
    new ResizeObserver(resize).observe(root);

    renderer.domElement.addEventListener(&#x27;pointerdown&#x27;, event =&gt; {
      dragging = true;
      lastX = event.clientX;
      lastY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });
    renderer.domElement.addEventListener(&#x27;pointermove&#x27;, event =&gt; {
      if (!dragging || topView) return;
      yaw -= (event.clientX - lastX) * 0.008;
      pitch = THREE.MathUtils.clamp(pitch + (event.clientY - lastY) * 0.006, 0.18, 1.15);
      lastX = event.clientX;
      lastY = event.clientY;
    });
    renderer.domElement.addEventListener(&#x27;pointerup&#x27;, () =&gt; { dragging = false; });
    renderer.domElement.addEventListener(&#x27;wheel&#x27;, event =&gt; {
      event.preventDefault();
      distance = THREE.MathUtils.clamp(distance + event.deltaY * 0.025, 34, 78);
    }, { passive: false });

    renderer.domElement.addEventListener(&#x27;click&#x27;, event =&gt; {
      if (Math.abs(event.clientX - lastX) &gt; 5 || Math.abs(event.clientY - lastY) &gt; 5) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(stations.map(s =&gt; s.group), true);
      if (!hits.length) return;
      const station = stations.find(s =&gt; {
        let obj = hits[0].object;
        while (obj) { if (obj === s.group) return true; obj = obj.parent; }
        return false;
      });
      if (station) {
        target.set(station.group.position.x * 0.45, 4.8, station.group.position.z * 0.45);
        stations.forEach(s =&gt; s.label.classList.toggle(&#x27;is-active&#x27;, s === station));
      }
    });

    root.querySelector(&#x27;[data-action=&quot;toggle&quot;]&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
      running = !running;
      event.currentTarget.setAttribute(&#x27;aria-pressed&#x27;, String(running));
      event.currentTarget.textContent = running ? &#x27;暂停运行&#x27; : &#x27;继续运行&#x27;;
    });
    root.querySelector(&#x27;[data-action=&quot;reset&quot;]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      topView = false;
      yaw = 0;
      pitch = 0.52;
      distance = 54;
      target.set(0, 3.6, 0);
      root.querySelector(&#x27;[data-action=&quot;view&quot;]&#x27;).textContent = &#x27;切换俯视&#x27;;
    });
    root.querySelector(&#x27;[data-action=&quot;view&quot;]&#x27;).addEventListener(&#x27;click&#x27;, event =&gt; {
      topView = !topView;
      target.set(0, 3.6, 0);
      event.currentTarget.textContent = topView ? &#x27;切换斜视&#x27; : &#x27;切换俯视&#x27;;
    });

    resize();
    animate();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
