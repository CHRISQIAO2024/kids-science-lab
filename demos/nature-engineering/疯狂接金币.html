<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>疯狂接金币</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Comic Sans MS", "Microsoft YaHei", sans-serif;
      background: linear-gradient(#8be7ff, #fff6b7);
      user-select: none;
    }

    .game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .title {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 38px;
      font-weight: bold;
      color: #ff5c8a;
      text-shadow: 2px 2px 0 #fff, 4px 4px 0 #ffd166;
      z-index: 5;
      white-space: nowrap;
    }

    .score-board {
      position: absolute;
      top: 20px;
      right: 24px;
      padding: 10px 16px;
      border-radius: 18px;
      background: #ffffffcc;
      color: #ff7a00;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      z-index: 5;
    }

    .life-board {
      position: absolute;
      top: 76px;
      right: 24px;
      padding: 8px 14px;
      border-radius: 18px;
      background: #ffffffcc;
      font-size: 24px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      z-index: 5;
    }

    .speed-control {
      position: absolute;
      top: 20px;
      left: 24px;
      width: 220px;
      padding: 12px 14px;
      border-radius: 18px;
      background: #ffffffcc;
      color: #5c4d7d;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      z-index: 5;
    }

    .speed-control label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .speed-control span {
      color: #ff7a00;
      white-space: nowrap;
    }

    .speed-control input {
      width: 100%;
      accent-color: #ff7a00;
      cursor: pointer;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 8px 14px;
      border-radius: 999px;
      background: #ffffffaa;
      color: #5c4d7d;
      font-size: 16px;
      z-index: 5;
    }

    .basket {
      position: absolute;
      bottom: 55px;
      left: 50%;
      width: 90px;
      height: 70px;
      transform: translateX(-50%);
      font-size: 64px;
      text-align: center;
      line-height: 70px;
      z-index: 4;
      transition: transform 0.05s linear;
    }

    .falling-item {
      position: absolute;
      font-size: 42px;
      z-index: 3;
      animation: wiggle 0.8s infinite alternate ease-in-out;
    }

    @keyframes wiggle {
      from {
        transform: rotate(-8deg);
      }
      to {
        transform: rotate(8deg);
      }
    }

    .cloud {
      position: absolute;
      font-size: 70px;
      opacity: 0.8;
      z-index: 1;
    }

    .cloud.one {
      left: 8%;
      top: 90px;
    }

    .cloud.two {
      right: 12%;
      top: 150px;
    }

    .grass {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 52px;
      background: repeating-linear-gradient(
        45deg,
        #6edb63,
        #6edb63 12px,
        #58c957 12px,
        #58c957 24px
      );
      z-index: 2;
    }

    .game-over {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 10;
      align-items: center;
      justify-content: center;
    }

    .game-over-card {
      width: min(360px, 88vw);
      padding: 28px 22px;
      border-radius: 24px;
      background: #fff;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      border: 6px solid #ffd166;
    }

    .game-over-card h2 {
      margin: 0 0 12px;
      color: #ff5c8a;
      font-size: 36px;
    }

    .game-over-card p {
      margin: 0 0 20px;
      color: #5c4d7d;
      font-size: 22px;
      font-weight: bold;
    }

    .restart-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 24px;
      background: #06d6a0;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #02a87d;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #02a87d;
    }

    @media (max-width: 720px) {
      .title {
        top: 92px;
        font-size: 30px;
      }

      .speed-control {
        width: 180px;
        font-size: 14px;
      }
    }
  </style>
  <!-- SpaceX 风格字体统一注入：思源宋体 (Noto Serif SC) + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet">
  <style id="spacex-font-override">
    body, h1, h2, h3, h4, h5, .title {
      font-family: 'Noto Serif SC', "Source Han Serif SC", "Songti SC", serif !important;
    }
    svg text {
      font-family: 'Noto Serif SC', "Source Han Serif SC", "Songti SC", serif !important;
    }
    button, input, select, .btn, .badge, .tag, .meta, .param, code, pre, .stat, footer, .kids-lab-back-float {
      font-family: 'JetBrains Mono', 'Inter', monospace, sans-serif !important;
    }
    .kids-lab-back-float {
      position: fixed !important;
      bottom: 24px !important;
      left: 24px !important;
      z-index: 999999 !important;
      background: rgba(5, 7, 13, 0.92) !important;
      backdrop-filter: blur(14px) !important;
      color: #38bdf8 !important;
      padding: 10px 18px !important;
      border-radius: 4px !important;
      font-size: 12px !important;
      font-weight: 700 !important;
      letter-spacing: 1px !important;
      text-decoration: none !important;
      border: 1px solid rgba(56, 189, 248, 0.4) !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(56, 189, 248, 0.2) !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      transition: all 0.2s !important;
    }
    .kids-lab-back-float:hover {
      background: #38bdf8 !important;
      color: #000 !important;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.6) !important;
      transform: translateY(-2px) !important;
    }
  </style>
</head>
<body>
  <div class="game" id="game">
    <div class="title">疯狂接金币</div>

    <div class="score-board">
      分数：<span id="score">0</span>
    </div>

    <div class="life-board" id="lifeBoard">❤️❤️❤️</div>

    <div class="speed-control">
      <label for="speedRange">
        掉落速度
        <span id="speedText">正常</span>
      </label>
      <input id="speedRange" type="range" min="1" max="5" value="3" />
    </div>

    <div class="cloud one">☁️</div>
    <div class="cloud two">☁️</div>

    <div class="basket" id="basket">🧺</div>

    <div class="hint">按键盘 ← → 移动篮子</div>
    <div class="grass"></div>

    <div class="game-over" id="gameOver">
      <div class="game-over-card">
        <h2>游戏结束</h2>
        <p>最终得分：<span id="finalScore">0</span></p>
        <button class="restart-btn" id="restartBtn">重新开始</button>
      </div>
    </div>
  </div>

  <script>
    const game = document.getElementById("game");
    const basket = document.getElementById("basket");
    const scoreEl = document.getElementById("score");
    const lifeBoard = document.getElementById("lifeBoard");
    const gameOverPanel = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");
    const restartBtn = document.getElementById("restartBtn");
    const speedRange = document.getElementById("speedRange");
    const speedText = document.getElementById("speedText");

    const emojis = ["💰", "🍎", "🍓", "⭐", "🍭", "🍌"];
    const speedNames = ["很慢", "慢速", "正常", "快速", "超快"];

    let score = 0;
    let lives = 3;
    let basketX = window.innerWidth / 2 - 45;
    let basketSpeed = 12;
    let fallSpeedLevel = Number(speedRange.value);
    let leftPressed = false;
    let rightPressed = false;
    let items = [];
    let spawnTimer = null;
    let animationId = null;
    let isGameOver = false;

    function updateBasket() {
      basket.style.left = basketX + "px";
      basket.style.transform = "none";
    }

    function updateScore() {
      scoreEl.textContent = score;
    }

    function updateLives() {
      lifeBoard.textContent = "❤️".repeat(lives);
    }

    function updateSpeedControl() {
      fallSpeedLevel = Number(speedRange.value);
      speedText.textContent = speedNames[fallSpeedLevel - 1];
    }

    function createItem() {
      if (isGameOver) return;

      const item = document.createElement("div");
      item.className = "falling-item";
      item.textContent = emojis[Math.floor(Math.random() * emojis.length)];

      const size = 46;
      const x = Math.random() * (window.innerWidth - size);
      const y = -60;
      const baseSpeed = 1.8 + Math.random() * 1.6;

      item.style.left = x + "px";
      item.style.top = y + "px";

      game.appendChild(item);

      items.push({
        el: item,
        x,
        y,
        size,
        baseSpeed
      });
    }

    function rectsOverlap(a, b) {
      return (
        a.left < b.right &&
        a.right > b.left &&
        a.top < b.bottom &&
        a.bottom > b.top
      );
    }

    function gameLoop() {
      if (isGameOver) return;

      if (leftPressed) {
        basketX -= basketSpeed;
      }

      if (rightPressed) {
        basketX += basketSpeed;
      }

      basketX = Math.max(0, Math.min(window.innerWidth - 90, basketX));
      updateBasket();

      const basketRect = basket.getBoundingClientRect();

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.baseSpeed * fallSpeedLevel;
        item.el.style.top = item.y + "px";

        const itemRect = item.el.getBoundingClientRect();

        if (rectsOverlap(itemRect, basketRect)) {
          score += 1;
          updateScore();
          item.el.remove();
          items.splice(i, 1);
          continue;
        }

        if (item.y > window.innerHeight) {
          lives -= 1;
          updateLives();
          item.el.remove();
          items.splice(i, 1);

          if (lives <= 0) {
            endGame();
            return;
          }
        }
      }

      animationId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
      score = 0;
      lives = 3;
      isGameOver = false;
      basketX = window.innerWidth / 2 - 45;

      updateScore();
      updateLives();
      updateBasket();

      items.forEach(item => item.el.remove());
      items = [];

      gameOverPanel.style.display = "none";

      clearInterval(spawnTimer);
      cancelAnimationFrame(animationId);

      spawnTimer = setInterval(createItem, 800);
      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isGameOver = true;
      clearInterval(spawnTimer);
      cancelAnimationFrame(animationId);

      finalScoreEl.textContent = score;
      gameOverPanel.style.display = "flex";
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        leftPressed = true;
      }

      if (event.key === "ArrowRight") {
        rightPressed = true;
      }
    });

    document.addEventListener("keyup", event => {
      if (event.key === "ArrowLeft") {
        leftPressed = false;
      }

      if (event.key === "ArrowRight") {
        rightPressed = false;
      }
    });

    restartBtn.addEventListener("click", startGame);
    speedRange.addEventListener("input", updateSpeedControl);

    window.addEventListener("resize", () => {
      basketX = Math.max(0, Math.min(window.innerWidth - 90, basketX));
      updateBasket();
    });

    updateSpeedControl();
    startGame();
  </script>
<a href="../../index.html" class="kids-lab-back-float">← 薪钰AI CODING梦工厂 // 返回控制台</a>
</body>
</html>
