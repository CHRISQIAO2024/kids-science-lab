    font-size:40px;
    display:none;
    background:rgba(0,150,0,0.7);
    padding:30px;
    border-radius:20px;
}
</style>

<body>

<div id="info">
🌲 森林救援任务<br>
控制：WASD / 方向键<br>
任务：找到受伤动物<br>
分数：<span id="score">0</span>
</div>

<div id="success">
🐼 救援成功！
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

let scene,camera,renderer;

let drone;
let animal;

let score=0;

let keys={};


init();
animate();



function init(){

    scene=new THREE.Scene();

    scene.background=new THREE.Color(0x87ceeb);



    camera=new THREE.PerspectiveCamera(
        60,
        window.innerWidth/window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0,8,12);



    renderer=new THREE.WebGLRenderer({
        antialias:true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(renderer.domElement);



    // 光照

    let light=new THREE.DirectionalLight(
        0xffffff,
        1
    );

    light.position.set(5,10,5);

    scene.add(light);


    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            0.5
        )
    );



    // 地面

    let ground=new THREE.Mesh(
        new THREE.PlaneGeometry(50,50),
        new THREE.MeshLambertMaterial({
            color:0x228B22
        })
    );

    ground.rotation.x=-Math.PI/2;

    scene.add(ground);



    // 树木

    for(let i=0;i<30;i++){

        createTree(
            Math.random()*30-15,
            Math.random()*30-15
        );

    }



    // 无人机

    drone=new THREE.Group();


    let body=new THREE.Mesh(
        new THREE.BoxGeometry(1.2,0.3,1),
        new THREE.MeshPhongMaterial({
            color:0x333333
        })
    );


    drone.add(body);


    let propeller=new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.8,
            0.8,
            0.05
        ),
        new THREE.MeshBasicMaterial({
            color:0xdddddd
        })
    );

    propeller.rotation.x=Math.PI/2;

    propeller.position.y=0.25;

    drone.add(propeller);


    drone.position.set(0,2,0);

    scene.add(drone);




    // 小动物

    animal=new THREE.Mesh(

        new THREE.SphereGeometry(
            0.5,
            20,
            20
        ),

        new THREE.MeshPhongMaterial({
            color:0xffffff
        })

    );


    animal.position.set(
        5,
        0.5,
        -5
    );


    scene.add(animal);



    window.addEventListener(
        "keydown",
        e=>{
            keys[e.key.toLowerCase()]=true;
        }
    );


    window.addEventListener(
        "keyup",
        e=>{
            keys[e.key.toLowerCase()]=false;
        }
    );


    window.addEventListener(
        "resize",
        ()=>{

            camera.aspect=
            window.innerWidth/
            window.innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

        }
    );

}




function createTree(x,z){

    let tree=new THREE.Group();


    let trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            0.2,
            0.3,
            2
        ),

        new THREE.MeshPhongMaterial({
            color:0x8B4513
        })
    );


    trunk.position.y=1;


    tree.add(trunk);



    let leaves=new THREE.Mesh(

        new THREE.SphereGeometry(
            1,
            16,
            16
        ),

        new THREE.MeshPhongMaterial({
            color:0x006400
        })
    );


    leaves.position.y=2.3;


    tree.add(leaves);



    tree.position.set(x,0,z);


    scene.add(tree);

}




function controlDrone(){

    let speed=0.15;


    if(keys["w"] || keys["arrowup"])
        drone.position.z-=speed;


    if(keys["s"] || keys["arrowdown"])
        drone.position.z+=speed;


    if(keys["a"] || keys["arrowleft"])
        drone.position.x-=speed;


    if(keys["d"] || keys["arrowright"])
        drone.position.x+=speed;



    // 摄像机跟随

    camera.position.x=
    drone.position.x;

    camera.position.z=
    drone.position.z+10;


    camera.lookAt(
        drone.position
    );

}




function checkRescue(){

    let distance=
    drone.position.distanceTo(
        animal.position
    );


    if(distance<1.5 && score==0){

        score=50;

        document.getElementById(
            "score"
        ).innerHTML=score;


        document.getElementById(
            "success"
        ).style.display="block";

    }

}





function animate(){

    requestAnimationFrame(
        animate
    );


    controlDrone();

    checkRescue();



    renderer.render(
        scene,
        camera
    );

}


</script>
